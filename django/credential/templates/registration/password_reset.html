{% extends 'base.html' %}

<!DOCTYPE html>
<html lang="en">    

    <head>
        <meta charset="UTF-8">
        <title>Paraninfo</title>
        {% load static %}
        
    </head>

    <body>
        
        {% block content %}
            {% block title %}Login{% endblock %}
            
            <h2>Esqueci minha senha</h2>
            <p>Insira o e-mail cadastrado para receber um link de redefinição de senha.</p>

            <form method="post" class="user-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="generic-button">Enviar</button>
            </form>

        {% endblock %}

    </body>
</html>
