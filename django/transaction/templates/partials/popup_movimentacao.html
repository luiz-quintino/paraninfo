<!-- Popup Modal -->
<div id="popup-modal" class="popup-modal balance-detail-popup" style="display: none;" aria-modal="true" role="dialog">
    <div class="form-container">
        <h3 id="popup_title">Detalhes do registro</h3>
        <form id="popup-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="popup-data">Data:</label>
                <input type="text" id="popup-data" name="data" readonly>
            </div>

            <div id="popup-credito-group">
                <div class="form-group">
                    <label for="popup-credito">Crédito:</label>
                    <input type="text" id="popup-credito" name="credito" readonly>
                </div>
            </div>

            <div id="popup-debito-group">
                <div class="form-group">
                    <label for="popup-debito">Débito:</label>
                    <input type="text" id="popup-debito" name="debito" readonly>
                </div>
            </div>
            
            <div id="popup-nome-group">
                <div class="form-group">
                    <label for="popup-nome">Nome:</label>
                    <input type="text" id="popup-nome" name="nome" readonly>
                    <input type="text" id="popup-user_id" name="nome" readonly>
                    
                </div>
            </div>

            <!-- Movimentação default -->
            <div id="default-movimentacao">
                <div class="form-group">
                    <label for="popup-cpf">CPF:</label>
                    <input type="text" id="popup-cpf" name="cpf" readonly>
                </div>

                <div class="form-group">
                    <label for="popup-nota">Anotação:</label>
                    <input type="text" id="popup-nota" name="nota" readonly>
                </div>
            </div>

            <!-- Movimentação contabilidade -->
            <div id="contabil-movimentacao" style="display: none;">
                <div class="form-group">
                    <label for="popup-transacao">Transacao:</label>
                    <input type="text" id="popup-transacao" name="transacao" readonly>
                </div>

                <div class="form-group">
                    <label for="popup-registro">Registrado por:</label>
                    <input type="text" id="popup-registro_name" name="registro" readonly>
                    <input type="text" id="popup-registro" name="registro" readonly>
                </div>

                <div class="form-group">
                    <label for="popup-associacao">Classificado por:</label>
                    <input type="text" id="popup-associacao_name" name="associacao" readonly>
                    <input type="text" id="popup-associacao" name="associacao" readonly>
                </div>

                <div class="form-group">
                    <label for="popup-fechamento">Ravisado por:</label>
                    <input type="text" id="popup-fechamento_name" name="fechamento" readonly>
                    <input type="text" id="popup-fechamento" name="fechamento" readonly>
                </div>
            </div>


            <div class="action-buttons product-card-actions">
                <button type="button" class="save-button" onclick="closePopup()">Fechar</button>
                <button type="button" class="cancel-button" id="popup-return-review" data-action-url="{% url 'analise_movimentacao' %}" hidden>Retornar para revisão</button>
            </div>
        </form>
    </div>
</div>

<script>
    (() => {
        const returnButton = document.getElementById('popup-return-review');
        const popupForm = document.getElementById('popup-form');
        if (!returnButton || !popupForm) return;

        window.configureReturnReviewButton = (details) => {
            returnButton.dataset.extratoId = details.id || '';
            returnButton.hidden = !details.can_return_to_review;
        };

        returnButton.addEventListener('click', async () => {
            if (!window.confirm('Tem certeza que deseja retornar o registro para revisão?')) return;

            showLoadingOverlay();
            try {
                const csrfToken = popupForm.querySelector('[name="csrfmiddlewaretoken"]').value;
                const response = await fetch(returnButton.dataset.actionUrl, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken,
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: new URLSearchParams({
                        return_to_review: '1',
                        extrato_id: returnButton.dataset.extratoId,
                    }),
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Não foi possível retornar o registro para revisão.');
                window.location.reload();
            } catch (error) {
                alert(error.message);
                hideLoadingOverlay();
            }
        });
    })();
</script>
